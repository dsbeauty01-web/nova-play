<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova · Wave</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--room:#f4d9ea;--hoodie:#7c5cbf;--amber:#e6a93a;--amber-hot:#f2c66d;--ice:#aee8ff;--ink:#2a2140}
html,body{margin:0;height:100%;background:#1a0f2e;font-family:Nunito,system-ui;color:#fff;overflow:hidden}
#stage{position:fixed;inset:0;display:flex}
#novaWrap,#camWrap{position:relative;width:50vw;height:100vh;overflow:hidden;background:#1a0f2e}
#novaVid{position:absolute;left:50%;top:0;height:100vh;width:auto;transform:translateX(-50%);z-index:2}
#novaAmbient{position:absolute;inset:-10%;width:120%;height:120%;filter:blur(30px) saturate(1.1);opacity:.85;z-index:1}
#fxNova{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#usercam{width:100%;height:100%;object-fit:contain;transform:scaleX(-1);background:#120a22}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.tag{position:absolute;left:14px;top:14px;z-index:8;background:rgba(0,0,0,.45);padding:5px 14px;border-radius:999px;font-weight:800;font-size:13px}
#hud{position:fixed;top:1.6vh;left:0;right:0;display:flex;gap:16px;justify-content:center;align-items:center;z-index:50}
#stars{font-size:34px;letter-spacing:2px;min-height:44px;text-shadow:0 2px 12px rgba(0,0,0,.5)}#fire{font-size:34px}
#flow{display:flex;gap:6px}#flow i{width:28px;height:8px;border-radius:4px;background:rgba(255,255,255,.18)}#flow i.on{background:var(--amber)}
#cap{position:fixed;left:0;right:0;bottom:5vh;text-align:center;z-index:50;font-family:'Baloo 2';font-weight:800;font-size:clamp(22px,3.4vw,40px);text-shadow:0 2px 18px rgba(0,0,0,.7)}
#gate,#banner,#gateArms{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(26,15,46,.86);z-index:90;text-align:center;padding:24px}
#gate button{font:800 28px 'Baloo 2';padding:18px 44px;border:0;border-radius:18px;background:var(--amber);color:var(--ink);cursor:pointer}
#banner{background:#3a0d0d;color:#ffb3b3;font-weight:800;font-size:22px}
#ring{width:120px;height:120px;border-radius:50%;border:6px solid rgba(255,255,255,.25);border-top-color:var(--amber);margin-top:18px;transition:border-color .2s}
#ring.ok{border-color:#7ddba3}
#scorecard{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(26,15,46,.9);z-index:95;font-family:'Baloo 2'}
#scorecard h1{font-size:64px;color:var(--amber);margin:0}
#scorecard p{font-size:24px;margin:8px 0}
#scorecard button{font:800 24px 'Baloo 2';padding:14px 36px;border:0;border-radius:16px;background:var(--amber);color:var(--ink);margin-top:20px;cursor:pointer}
.hidden{display:none!important}
</style></head><body>
<div id="stage">
  <div id="novaWrap"><canvas id="novaAmbient" width="96" height="54"></canvas><video id="novaVid" playsinline preload="auto"></video><canvas id="fxNova"></canvas><div class="tag">NOVA — copy her wave</div></div>
  <div id="camWrap"><video id="usercam" autoplay muted playsinline></video><canvas id="fx"></canvas><div class="tag" id="youTag">YOU</div></div>
  <div id="hud"><div id="stars"></div><div id="fire"></div></div>
  <div id="cap"></div>
  <div id="dbg" style="position:fixed;left:8px;bottom:8px;z-index:99;font:600 12px monospace;background:rgba(0,0,0,.6);color:#9f9;padding:6px 10px;border-radius:8px;white-space:pre"></div>
  <div id="gate"><button id="start">▶ Let's wave</button></div>
  <div id="gateArms" class="hidden"><div style="font:800 30px 'Baloo 2'">Step back — I need to see your arms</div><div id="ring"></div></div>
  <div id="banner" class="hidden"></div>
  <div id="scorecard"><div id="medal" style="font-size:110px;line-height:1"></div><h1 id="finalStars" style="font-size:48px"></h1><p id="finalLine"></p><button id="again">PLAY AGAIN</button></div>
  <div id="measure" class="hidden" style="position:fixed;inset:0;z-index:96;background:rgba(26,15,46,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center"><div style="font:800 28px 'Baloo 2'" id="mTitle">Measuring Nova's waves…</div><div id="mInfo"></div><textarea id="mOut" style="width:min(720px,90vw);height:220px;font:600 13px monospace;background:#120a22;color:#9f9;border:1px solid #3a2a63;border-radius:10px;padding:10px"></textarea><a id="mDl" style="color:#ffc23e;font-weight:800" download="wave-times.json">⬇ download wave-times.json</a></div>
</div>
<script type="module">
/* ── WAVE v2 (2026-10-01) — the fix for "3 fps, not connected, not clean".
   Why it was slow: the page ran body-tracking on TWO videos (hers and the child's) through one detector, and
   decoded her clip twice (the blurred background was a second copy). Now:
     · her wave times come from a FILE (beta/wave/wave-times.json) — her clip never changes, so it is measured once
       (open this page with ?measure=1) instead of re-tracked on every frame of every play;
     · TURNS (default): her clip pauses after each of her waves, the child waves, her clip continues — so at any moment
       only ONE heavy thing runs (her clip OR the child's tracking). ?turns=0 = the old continuous flow;
     · the blurred background is a tiny canvas copy, not a second video decode;
     · one direction everywhere: shoulder → elbow → hand (her words, the cue dots, the judge);
     · no numbers on screen: a star per wave, 🔥 for a smooth streak, a medal + stars at the end.
   The certified WaveRule still scores; the wave.arm recipe still shows the cue, the comet and the burst. ── */
import { MoverEngine } from '../shared/mover-engine.js';
import { WaveRule } from '../shared/mover-rules.js';
import { LightEngine } from '../shared/light-engine.js';
import { createMoves } from '../shared/move-recipes.js';
import { createLights } from '../shared/nova-lights.js';
const _cdn = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script load failed: ' + src)); document.head.appendChild(s); });
const _tfReady = (async () => {
  await _cdn('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
  await _cdn('https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js');
  return { tf: window.tf, poseDetection: window.poseDetection };
})();

const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const MEASURE = Q.get('measure') === '1';
const TURNS = Q.get('turns') !== '0';
const novaVid = $('novaVid'), amb = $('novaAmbient'), ambCx = amb.getContext('2d'), cam = $('usercam'), cap = $('cap');
const REF_CANDIDATES = ['../media/wave-ref.mp4', '../media/handywave.mp4', '/handywave.mp4'];
const TIMES_URL = '../beta/wave/wave-times.json';
const NOTE = '/nova/note';
window.addEventListener('error', e => { DBG.err = 'global:' + e.message; dbg(); });
const banner = msg => { $('banner').textContent = msg; $('banner').classList.remove('hidden'); };
async function pickRef(){ for (const u of REF_CANDIDATES){ try { const r = await fetch(u, { method: 'HEAD' }); if (r.ok) return u; } catch (e) {} } return null; }

// ── pose: ONE detector, ONE video at a time ──
let det = null;
async function initPose(){
  const { tf, poseDetection } = await _tfReady;
  await tf.setBackend('webgl'); await tf.ready();
  det = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING, enableSmoothing: true });
}
const MN = { nose:0, lShoulder:5, rShoulder:6, lElbow:7, rElbow:8, lWrist:9, rWrist:10, lHip:11, rHip:12 };
async function detect(el){ if (!det || !(el.videoWidth > 0)) return null; const poses = await det.estimatePoses(el, { flipHorizontal: false }); const kp = poses?.[0]?.keypoints; if (!kp) return null;
  const W = el.videoWidth, H = el.videoHeight, out = {}; for (const [n, i] of Object.entries(MN)){ const p = kp[i]; if (p) out[n] = { x: p.x / W, y: p.y / H, z: 0, vis: p.score ?? 0 }; } return out; }

// ── the blurred background: a tiny canvas copy of her clip, 4× a second (was a 2nd full video decode) ──
setInterval(() => { try { if (novaVid.videoWidth) ambCx.drawImage(novaVid, 0, 0, amb.width, amb.height); } catch (e) {} }, 250);

// ── engines ──
const EK = new MoverEngine();
const LK = new LightEngine($('fx'), { tier: 'adult', mirror: true });            // kept for its instant sounds only
const wK = { R: new WaveRule(EK, 'R'), L: new WaveRule(EK, 'L') };
const lights = createLights($('fx'), { video: cam, fit: Q.get('fit') || 'contain', mirror: Q.get('mirror') !== '0', debug: Q.get('dots') === '1' });
const moves = createMoves(lights, { mirror: Q.get('mirror') !== '0' });
const ARM_CUE = { R: ['lShoulder', 'lElbow', 'lWrist'], L: ['rShoulder', 'rElbow', 'rWrist'] };   // her arm → HIS (mirrored), shoulder → hand

// ── state ──
let score = 0, stars = 0, streak = 0, hits = 0, pending = [], stats = { R: [], L: [] }, running = false, ended = false, lastKidWave = 0;
const WINDOW_MS = 1800, TURN_MS = 2600, AFTER_HIT_MS = 450;
let TIMES = [], nextCue = 0, turn = null, turnOn = false, turnEnd = 0, turnNo = 0, frameN = 0;
const AGREE = [];
const LINES = [[0.5, 'Copy her wave — shoulder, elbow, hand.'], [13, 'Other arm too — shoulder, elbow, hand.'], [24, 'Last one — make it smooth.']];
let li = 0;
function say(t){ cap.textContent = t; fetch(NOTE, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ say: t }) }).catch(() => {}); }
function drawStars(){ $('stars').textContent = '⭐'.repeat(Math.min(stars, 12)) + (stars > 12 ? '🌟' : ''); $('fire').textContent = streak >= 3 ? '🔥' : ''; }

// ── one turn = one of HER waves (from the file) + the child's answer ──
function turnStart(c){
  if (turn) turnClose();
  turn = { n: ++turnNo, t0: performance.now(), cueArm: c.arm, demoMs: c.ms, old: null, neu: null, doneAt: 0 };
  pending.push({ arm: c.arm, t0: turn.t0 }); DBG.cues++;
  moves.cue('wave.arm', { chain: ARM_CUE[c.arm], ms: c.ms });       // the dots run shoulder → hand on HIS matching arm
  turnOn = true; turnEnd = performance.now() + TURN_MS + (TURNS ? c.ms : 0);
  if (TURNS){ novaVid.pause(); cap.textContent = 'Your turn!'; }
}
function turnClose(){
  if (!turn) return;
  moves.clear('wave.arm'); turnOn = false;
  const t = turn; turn = null;
  AGREE.push({ turn: t.n, old: !!t.old, neu: !!t.neu, cueArm: t.cueArm });
  console.log(`[WAVE] turn=${t.n} old=${t.old ? 'pass' : 'fail'} new=${t.neu ? 'pass' : 'fail'} herArm=${t.cueArm}` + (t.neu ? ` new: arm=${t.neu.arm} dir=${t.neu.dir} ms=${t.neu.ms}` : ''));
  if (TURNS && !ended && running){ cap.textContent = ''; novaVid.play().catch(() => {}); }
}

// ── loops ──
const DBG = { kid: 0, kidJ: 0, cues: 0, hits: 0, neu: 0, fps: 0, err: '' }; const dbgEl = $('dbg');
let fpsN = 0, fpsT = performance.now();
function dbg(){ dbgEl.textContent = `kid ${DBG.fps} fps | frames ${DBG.kid} joints ${DBG.kidJ} | turns ${DBG.cues} old-hits ${DBG.hits} new-waves ${DBG.neu} | ${TURNS ? 'turns' : 'continuous'}${DBG.err ? ' | ERR ' + DBG.err : ''}`; }
async function loopKid(){ if (!running) return; try {
  frameN++;
  const busy = TURNS && !turnOn;                                   // her turn: track the child lightly (lights stay alive), not every frame
  if (cam.videoWidth > 0 && (!busy || frameN % 3 === 0)){ const k = await detect(cam); DBG.kid++; fpsN++;
    if (k){ DBG.kidJ = Object.keys(k).length; EK.update(k); lights.feed(k);
      if (turnOn){
        const r = moves.live('wave.arm', k, performance.now() / 1000);
        if (r?.done){ moves.result('wave.arm', 'ok', r); LK.audio?.ding?.(); if (turn && !turn.neu){ turn.neu = { ...r.done }; turn.doneAt ||= performance.now(); } DBG.neu++; }
      }
      for (const arm of ['R', 'L']){ const w = wK[arm].check(); if (w?.hit && performance.now() - lastKidWave > 600){ lastKidWave = performance.now(); DBG.hits++; onKidWave(arm, w); } } } }
  if (performance.now() - fpsT >= 1000){ DBG.fps = fpsN; fpsN = 0; fpsT = performance.now(); }
  } catch (e) { DBG.err = 'kid:' + e.message; } dbg(); requestAnimationFrame(loopKid); }
function onKidWave(arm, w){
  const now = performance.now(); const i = pending.findIndex(p => now - p.t0 <= WINDOW_MS + (TURNS ? 1200 : 0));
  const matched = i >= 0; if (matched) pending.splice(i, 1);
  const base = w.quality === 'smooth' ? 160 : w.quality === 'good' ? 140 : 120;
  let pts = matched ? base : Math.round(base * 0.5);
  if (w.iso) pts += 20; streak = w.quality === 'smooth' ? streak + 1 : 0; if (streak >= 3) pts *= 2;
  score += pts; hits++; stats[arm].push(w.quality);               // score stays internal (the report); the child sees stars
  if (matched){ stars++; lights.word('⭐', arm === 'R' ? 'rWrist' : 'lWrist'); } else lights.word('✨', arm === 'R' ? 'rWrist' : 'lWrist');
  LK.audio?.tick?.(streak); drawStars();
  if (turn && !turn.old){ turn.old = { arm, quality: w.quality, at: Math.round(now - turn.t0) }; turn.doneAt ||= now; }
}
function loopClock(){ if (!running) return; try { const t = novaVid.currentTime;
  if (li < LINES.length && t >= LINES[li][0] && !turnOn){ say(LINES[li][1]); li++; }
  while (nextCue < TIMES.length && t >= TIMES[nextCue].t){ const c = TIMES[nextCue++]; if (!turnOn || !TURNS) turnStart(c); }   // her wave just ended → his turn
  pending = pending.filter(p => performance.now() - p.t0 <= WINDOW_MS + (TURNS ? 1200 + TURN_MS : 0));
  if (turn && (performance.now() >= turnEnd || (turn.doneAt && performance.now() - turn.doneAt >= AFTER_HIT_MS))) turnClose();
  if (!turnOn && (novaVid.ended || t >= novaVid.duration - 0.05)) return finish();
  } catch (e) { DBG.err = 'clock:' + e.message; dbg(); } requestAnimationFrame(loopClock); }

// ── MEASURE MODE: play her clip ONCE, find her waves, write wave-times.json (run once per clip) ──
async function measure(ref){
  $('measure').classList.remove('hidden');
  const EN = new MoverEngine(), wN = { R: new WaveRule(EN, 'R'), L: new WaveRule(EN, 'L') }, found = []; let n = 0, last = -9; const t0 = performance.now();
  novaVid.muted = true; const loaded = new Promise(r => { novaVid.onloadeddata = r; }); novaVid.src = ref; await loaded;   // listen BEFORE setting src (a cached clip can fire at once)
  await novaVid.play();
  await new Promise(done => { const tick = async () => {
    if (novaVid.ended || novaVid.currentTime >= novaVid.duration - 0.05) return done();
    const k = await detect(novaVid); n++;
    if (k){ EN.update(k); for (const arm of ['R', 'L']){ const w = wN[arm].check(); if (w?.hit && novaVid.currentTime - last > 0.9){ last = novaVid.currentTime;
      const gaps = w.gaps || [], per = gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : 240;
      found.push({ t: +novaVid.currentTime.toFixed(2), arm, ms: Math.max(900, Math.min(2000, Math.round(per * 2))) }); } } }
    $('mInfo').textContent = `${novaVid.currentTime.toFixed(1)} / ${novaVid.duration.toFixed(1)} s · ${found.length} waves · ${Math.round(n / ((performance.now() - t0) / 1000))} fps`;
    requestAnimationFrame(tick); }; tick(); });
  const out = { clip: ref.split('/').pop(), duration: +novaVid.duration.toFixed(2), measuredAt: new Date().toISOString(), fps: Math.round(n / ((performance.now() - t0) / 1000)), waves: found };
  const json = JSON.stringify(out, null, 1);
  $('mTitle').textContent = `Done — ${found.length} waves found. Save this as pages/beta/wave/wave-times.json`;
  $('mOut').value = json; $('mDl').href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  console.log('[WAVE-TIMES] ' + JSON.stringify(out));
}

// ── flow ──
$('start').onclick = async () => {
  $('gate').classList.add('hidden');
  const ref = await pickRef(); if (!ref) return banner('No wave video found in /media (need wave-ref.mp4 or handywave.mp4).');
  try { await initPose(); } catch (e) { return banner('Pose engine failed to load: ' + e.message); }
  if (MEASURE) return measure(ref);
  try { const j = await (await fetch(TIMES_URL, { cache: 'no-store' })).json(); TIMES = (j.waves || []).slice().sort((a, b) => a.t - b.t); } catch (e) { TIMES = []; }
  if (!TIMES.length) return banner('Her wave times are not measured yet — open this page once with ?measure=1 and save wave-times.json.');
  try { const s = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); cam.srcObject = s; } catch (e) { return banner('Camera blocked — allow the camera and reload.'); }
  novaVid.src = ref;
  $('gateArms').classList.remove('hidden'); let okSince = null;
  await new Promise(res => { const tick = async () => { const k = await detect(cam);
    const seen = n => k?.[n]?.vis > 0.5, arm = s => seen(s + 'Elbow') || seen(s + 'Wrist');
    const ok = !!k && seen('lShoulder') && seen('rShoulder') && (arm('l') || arm('r'));
    $('ring').classList.toggle('ok', !!ok); if (ok){ okSince ??= performance.now(); if (performance.now() - okSince > 1000) return res(); } else okSince = null; requestAnimationFrame(tick); }; tick(); });
  $('gateArms').classList.add('hidden');
  await new Promise(r => { if (cam.videoWidth > 0) r(); else cam.onloadedmetadata = () => r(); });
  say('Watch Nova — then it\'s your turn.'); running = true; novaVid.volume = 0.6; await novaVid.play();
  drawStars(); loopKid(); loopClock();
};
function finish(){ if (ended) return; ended = true; running = false; novaVid.pause(); turnClose(); moves.clear();
  const ag = AGREE.length ? `agreement old/new ${AGREE.filter(a => a.old === a.neu).length}/${AGREE.length}` : ''; if (ag) console.log('[WAVE-AGREE] ' + ag);
  const weak = stats.L.length < stats.R.length ? 'left' : 'right', share = TIMES.length ? stars / TIMES.length : 0;
  $('medal').textContent = share >= 0.7 ? '🥇' : share >= 0.4 ? '🥈' : '🥉';
  $('finalStars').textContent = '⭐'.repeat(Math.min(stars, 12)) || '✨';
  $('finalLine').textContent = stars ? `Beautiful waves! Next time lead the ${weak} arm — shoulder, elbow, hand.` : 'Next time — let the wave travel: shoulder, elbow, hand.';
  $('scorecard').style.display = 'flex'; say(stars ? 'Amazing waving!' : 'Great try — let\'s wave again!');
  fetch('/pulse', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ game: 'wave', score, stars, hits, turns: TIMES.length, stats, agree: AGREE, fps: DBG.fps, mode: TURNS ? 'turns' : 'continuous', at: Date.now() }) }).catch(() => {});
}
$('again').onclick = () => location.reload();
if (MEASURE) $('start').textContent = '▶ Measure her waves';
</script></body></html>
