<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova — demo</title>
<!-- beta/demo.html — attract / demo mode (night item E) for a lobby or showroom screen: loops Freeze → Copy Nova →
     Groove on recorded clips (no camera), with the real lights, captions and stars. "Tap to play" opens the launcher.
     ?lang=he for Hebrew. Each game is the real page in ?replay mode — nothing is faked or pre-rendered. -->
<link rel="stylesheet" href="play.css">
<style>
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#tap{position:fixed;left:50%;bottom:max(18px,4vh);transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 30px;border-radius:999px;background:linear-gradient(135deg,#ffd65a,#ffb45e);color:#2a1700;font:800 clamp(22px,6vw,34px) 'Baloo 2',Nunito;
  box-shadow:0 10px 40px rgba(255,180,94,.45);animation:breathe 2.4s ease-in-out infinite;cursor:pointer;border:0}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.06)}}
#tag{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;padding:6px 16px;border-radius:999px;background:rgba(20,11,38,.7);color:var(--gold);font:800 18px 'Baloo 2',Nunito}
#shield{position:fixed;inset:0;z-index:99;cursor:pointer}
</style>
</head><body>
<iframe id="frame" title="Nova demo" allow="autoplay"></iframe>
<div id="shield"></div><div id="tag"></div><button id="tap"></button>
<script type="module">
import { Q, getLang, applyLang } from './lib/play.js';
const lang = getLang(); applyLang(lang);
const T = { en: { tap: 'Tap to play! ▶', games: ['❄️ Freeze', '🙌 Copy Nova', '🎵 Groove'] }, he: { tap: 'לוחצים ומשחקים! ▶', games: ['❄️ קופאים', '🙌 תעשו כמו נובה', '🎵 גרוב'] } }[lang];
const LOOP = [
  'freeze3.html?replay=frozen-body,dance-hype,frozen-body&rounds=3',
  'copy.html?replay=pose-armsup,own-left-up,pose-star&poses=armsUp,leftUp,star',
  'groove.html?replay=dance-hype&bars=6',
];
const $ = id => document.getElementById(id), f = $('frame');
$('tap').textContent = T.tap;
const play = () => location.href = 'index.html?lang=' + lang;
$('tap').onclick = play; $('shield').onclick = play;
let i = 0, timer = null, endAt = null;
function next(){
  clearInterval(timer); endAt = null; const k = i++ % LOOP.length;
  $('tag').textContent = T.games[k];
  f.src = `${LOOP[k]}&fast=1&autostart=1&checked=1&lang=${lang}`;
  const t0 = Date.now();
  timer = setInterval(() => {          // the game page shows #end.on at its medal — hold the medal 3 s, then the next game
    let done = false; try { done = !!f.contentDocument?.querySelector('#end.on'); } catch {}
    if (done && !endAt) endAt = Date.now();
    if ((endAt && Date.now() - endAt > 3000) || Date.now() - t0 > 90000) next();
  }, 250);
}
next();
</script>
</body></html>
